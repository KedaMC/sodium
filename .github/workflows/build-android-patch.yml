# Builds the aarch64 Android-only patch of Sodium and uploads the resulting jars as a downloadable artifact.
# Runs on every push to a patch/** branch and can also be started by hand from the Actions tab.
name: build-android-patch

on:
  push:
    branches:
      - 'patch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract current branch name
        shell: bash
        # bash pattern expansion to grab branch name without slashes
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> "$GITHUB_OUTPUT"
        id: ref

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Execute Gradle assemble
        # Produces build/mods/sodium-fabric-*.jar and build/mods/sodium-neoforge-*.jar
        run: ./gradlew assemble --stacktrace

      - name: List built jars
        shell: bash
        run: ls -la build/mods/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          # GitHub packs the files below into a single .zip download
          name: sodium-android-aarch64-${{ steps.ref.outputs.branch }}-${{ github.run_number }}
          path: build/mods/*.jar
          if-no-files-found: error
